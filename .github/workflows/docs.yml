name: Wren documentation
on:
  push:
    branches: [main, feat/wren]
    paths: ['docs/site/**', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/site/**', 'CMakeLists.txt', 'pyproject.toml', 'uv.lock', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified documentation to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra docs
      - run: >
          cmake -S . -B build/manual -DWREN_BUILD_DOCS=ON -DBUILD_TESTING=OFF
          -DWREN_BUILD_CPP=OFF -DWREN_BUILD_RUST=OFF -DWREN_BUILD_FORTRAN=OFF
          -DWREN_BUILD_PYTHON=OFF -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
      - run: cmake --build build/manual --target wren_docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/manual/html
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
