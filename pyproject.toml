[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "universal-kmc"
version = "0.1.0"
description = "Portable continuous-time kinetic Monte Carlo in Python, C++, Rust and Fortran"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
ukmc = "universal_kmc.cli:main"

[tool.uv.build-backend]
module-name = "universal_kmc"
source-include = ["benchmarks/**", "docs/**", "examples/**", "cpp/**", "fortran/**", "rust/Cargo.toml", "rust/Cargo.lock", "rust/src/**", "rust/tests/**", "rust/examples/**", "tests/**", "scripts/**", "CMakeLists.txt", "Makefile", "uv.lock"]
source-exclude = ["build/**", "dist/**", "rust/target/**", "**/__pycache__/**", "**/*.pyc"]
